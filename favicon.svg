<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background rounded square -->
  <rect width="64" height="64" rx="12" fill="#2a78d6"/>
  <!-- face plate -->
  <rect x="10" y="14" width="44" height="36" rx="8" fill="#ffffff" opacity="0.08"/>
  <rect x="12" y="16" width="40" height="32" rx="6" fill="#ffffff" opacity="0.12"/>
  <!-- eyes -->
  <circle cx="24" cy="28" r="5" fill="#ffffff"/>
  <circle cx="40" cy="28" r="5" fill="#ffffff"/>
  <!-- mouth -->
  <rect x="22" y="38" width="20" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- antenna -->
  <rect x="30" y="6" width="4" height="10" rx="2" fill="#ffffff" opacity="0.95"/>
  <circle cx="32" cy="6" r="2.2" fill="#ffffff" opacity="0.95"/>
</svg>
